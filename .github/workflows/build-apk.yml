name: build-apk

# 只在自定义生产分支和自定义发布标签上跑，避免上游同步提交触发重复构建。
on:
  push:
    branches: [custom]
    tags: ['custom-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install platform 37 and build tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0"
          # AGP 的 compileSdk = 37 按 android-37 目录查找；SDK 包名是 37.0。
          if [ -d "$SDK/platforms/android-37.0" ] && [ ! -e "$SDK/platforms/android-37" ]; then
            ln -s "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          fi
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Assemble release
        run: |
          # 上游发布的 gradlew 是 CRLF，Linux 上 shebang 会带 \r。
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          # 上游本身用反射访问非 SDK API；lintVital 在 targetSdk 37 下会直接判死，
          # 但这是 LSPosed 模块的既有实现，不是本次补丁引入的。
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -x lintVitalRelease

      - name: Sign APK
        if: env.KEYSTORE_B64 != ''
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/liquidtab.keystore"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          SRC=$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          test -n "$SRC"
          OUT="LiquidTab-${VERSION_NAME}-${VERSION_CODE}-custom.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/liquidtab.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$OUT" "$SRC"
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"

      - name: Fallback unsigned APK
        if: env.KEYSTORE_B64 == ''
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          test -n "$SRC"
          cp "$SRC" "LiquidTab-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-unsigned.apk"
          sha256sum LiquidTab-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidTab-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            LiquidTab-*.apk
            LiquidTab-*.apk.sha256
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/custom-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LiquidTab-*.apk
            LiquidTab-*.apk.sha256
          generate_release_notes: true
          body: |
            基于上游 LiquidTab 的自定义构建（补丁基线见 fork/upstream-base）。
            安装前请确认设备允许跨签名覆盖安装，或先备份数据。
